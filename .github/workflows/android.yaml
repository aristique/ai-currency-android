name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod a+rwx artifacts
      - run: docker compose run --build --rm android-build
      - uses: actions/upload-artifact@v4
        with:
          name: lab4-android
          path: artifacts/
